# base 基座模型评测链：infer → split → answer_metrics → cot_metrics
#
# 用法：
#   python -m src.eval.infer       --config configs/eval_base.yaml
#   python -m src.eval.split       --config configs/eval_base.yaml
#   python -m src.eval.run_metrics --config configs/eval_base.yaml
#
# 相关配置：
#   ft 链   → configs/eval_ft.yaml
#   多 run 对比报告 → configs/compare.yaml（python -m src.eval.report --config configs/compare.yaml）
#
# 与 eval_ft.yaml 差异：model_path: null（Hub 原始权重），路径前缀 base_*

infer:
  model_id: Qwen/Qwen2.5-Math-7B-Instruct
  model_path: null                 # base：Hub 原始权重，不用 merged
  model_type: qwen2_5_math
  system_prompt: You are a math assistant that can answer questions and help with tasks.

  test_file: data/processed/test.jsonl
  infer_schema:
    messages:
      - role: user
        content: "<problem>"

  prediction_file: reports/predictions/base.jsonl
  temperature: 0.0
  max_new_tokens: 1024
  infer_limit: null
  max_batch_size: 2
  runtime:
    cuda_visible_devices: "0"

split:
  prediction_file: reports/predictions/base.jsonl
  strategies:
    - boxed
  cot_mode: before_answer
  answer_file: reports/predictions/base_answers.jsonl
  cot_file: reports/predictions/base_cots.jsonl

answer_metrics:
  pred_file: reports/predictions/base_answers.jsonl
  gold_file: data/processed/test.jsonl
  gold_field: answer
  pred_field: pred_answer
  join_key: id
  metrics: [exact_match, acc, extract_rate]
  metric_args:
    acc:
      numeric: true
  output_file: reports/metrics/base_answer.json

cot_metrics:
  pred_file: reports/predictions/base_cots.jsonl
  gold_file: data/processed/test.jsonl
  gold_field: COT
  pred_field: pred_cot
  context_field: problem
  join_key: id
  metrics: [bert_score, informativeness_chain]
  metric_args:
    bert_score:
      model_type: microsoft/deberta-base-mnli
      batch_size: 1
      device: cuda
      dtype: float32
    informativeness_chain:
      embedding_model: all-mpnet-base-v2
  output_file: reports/metrics/base_cot.json


output:
  report_dir: reports/
  metrics_dir: reports/metrics/
